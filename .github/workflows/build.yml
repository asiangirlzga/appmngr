name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only to attach the APK to a GitHub Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No Gradle wrapper is committed, so install Gradle directly (AGP 8.5 needs 8.7+).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ubuntu-latest already ships the Android SDK (platform 34 included).
      - name: Build release APK
        shell: bash   # bash with pipefail, so a failed build still fails the step
        run: gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show errors (only if the build failed)
        if: failure()
        run: |
          echo "=== Compiler / resource errors ==="
          grep -nE "^e: |^w: .*error|error:|AAPT|R8:|FAILED|What went wrong" -A6 build.log | head -150 || true

      - name: Upload build log and reports (only if the build failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            build.log
            app/build/reports/
          if-no-files-found: ignore

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk TvAppManager.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TvAppManager-apk
          path: TvAppManager.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TvAppManager.apk
